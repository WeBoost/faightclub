<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow" />
  <title>BITTOPIA v0.8.0</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07131b;color:#f3f8f5;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    iframe{border:0;width:100%;height:100%;display:block;background:#07131b}
    #status{position:fixed;inset:0;z-index:3;display:grid;place-items:center;background:radial-gradient(circle at 50% 28%,#173b47,#07131b 55%,#03080d)}
    .card{text-align:center;padding:28px}.coin{width:82px;height:82px;margin:auto;border-radius:26px;display:grid;place-items:center;background:linear-gradient(145deg,#ffb43c,#ed7516);font-size:50px;font-weight:900;box-shadow:0 20px 55px #0008}h1{letter-spacing:.18em;margin:22px 0 8px;padding-left:.18em;font-size:clamp(25px,7vw,44px)}p{margin:0;color:#92a9b5;font-size:12px}.error{color:#ff9a91;max-width:620px;line-height:1.5}
  </style>
</head>
<body>
  <iframe id="game" title="BITTOPIA" allow="fullscreen; autoplay"></iframe>
  <div id="status"><div class="card"><div class="coin">₿</div><h1>BITTOPIA</h1><p id="copy">Loading verified build 0.8.0…</p></div></div>
  <script>
  (async()=>{
    const ASSET='https://ljcrrxcfkyircgpjcbmm.supabase.co/functions/v1/bittopia-live-v08?asset=html-gzip';
    const status=document.getElementById('status');
    const copy=document.getElementById('copy');
    const frame=document.getElementById('game');
    try{
      if(!('DecompressionStream' in window)) throw new Error('This browser does not support the required decompression API.');
      const response=await fetch(ASSET,{cache:'no-store'});
      if(!response.ok) throw new Error(`Game asset returned HTTP ${response.status}.`);
      const compressed=await response.arrayBuffer();
      if(compressed.byteLength!==66202) throw new Error(`Game asset size mismatch (${compressed.byteLength}).`);
      const stream=new Blob([compressed]).stream().pipeThrough(new DecompressionStream('gzip'));
      let html=await new Response(stream).text();
      if(!html.includes("window.__BITTOPIA_BUILD__ = '0.8.0'")) throw new Error('The hosted payload is not BITTOPIA build 0.8.0.');
      const showcase=new URLSearchParams(location.search).has('showcase');
      if(showcase) html=html.replace("const SHOWCASE = new URLSearchParams(location.search).has('showcase');","const SHOWCASE = true;");
      html=html
        .replace('<link rel="manifest" href="./manifest.webmanifest" />','')
        .replace('<link rel="icon" href="./icons/bittopia.svg" type="image/svg+xml" />','')
        .replace("if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});",'void 0;');
      frame.addEventListener('load',()=>setTimeout(()=>status.remove(),200),{once:true});
      frame.srcdoc=html;
      setTimeout(()=>{if(status.isConnected)status.remove();},5000);
    }catch(error){
      copy.className='error';
      copy.textContent=`Startup failed: ${error?.message||String(error)}`;
    }
  })();
  </script>
</body>
</html>
